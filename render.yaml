services:
  - type: web
    name: lacase-diplomado-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://lacase-diplomado-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: CURRENCY_REFRESH_MIN_MINUTES
        value: "8"
      - key: CURRENCY_REFRESH_MAX_MINUTES
        value: "14"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: lacase-uploads
